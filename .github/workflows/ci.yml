# Continuous integration: lint, typecheck, unit tests, schema/typegen drift, fixture and Sanity-snapshot builds,
# leak guards, redirects and security headers, launch-readiness report, JS budget, Playwright + axe.
# Lighthouse budgets are added later (CLAUDE.md §8; Q-50).
# No deployment happens here: deploys are the separate, manual deploy.yml (docs/DEPLOYMENT.md, D-034).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      # No Sanity credentials: CI uses fixtures and the NDJSON snapshot only (D-024). A live staging job is added
      # only once a project exists and its read token is stored as a secret (docs/CMS.md).
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (site, Worker, Studio; includes the snapshot drift, round-trip and hostile-content tests)
        run: pnpm test

      # The site's Sanity mapper compiles against types generated from the Studio schema (D-003, D-024).
      - name: Sanity schema and typegen drift
        run: pnpm typegen:check

      - name: Build Sanity Studio (offline, not deployed)
        run: pnpm --filter @auburn/studio build

      - name: Build (production mode)
        run: pnpm build

      - name: Build (preview mode)
        run: pnpm build:preview

      # The same site built through the Sanity adapter from the NDJSON snapshot, in both modes.
      - name: Build from the Sanity snapshot (production and preview)
        run: pnpm build:sanity-export

      # The Cloudflare configuration bundles for both Workers against the builds just made. No credentials, no upload.
      - name: Validate Cloudflare Worker configuration (dry run, both environments)
        working-directory: workers/edge
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm exec wrangler deploy --dry-run --env="" --outdir "$RUNNER_TEMP/wrangler-production"
          pnpm exec wrangler deploy --dry-run --env=preview --outdir "$RUNNER_TEMP/wrangler-preview"

      # What production hides and why, overdue reviews and the approval audit (D-019, D-026, D-027). Reports only;
      # never fails the build for missing content. Kept as an artifact, never deployed (docs/LAUNCH-READINESS.md).
      - name: Launch-readiness report
        run: pnpm readiness

      - name: Upload launch-readiness report
        uses: actions/upload-artifact@v5
        with:
          name: launch-readiness
          path: apps/site/reports/
          retention-days: 30

      # JS loaded on page load < 30 KB compressed on every page (CLAUDE.md §8, D-006).
      - name: JavaScript budget
        run: pnpm budget

      # Production must never contain preview-only output (CLAUDE.md §2.1, docs/DECISIONS.md D-005):
      # placeholders, status dots, the preview banner, catalogue specimens or the catalogue itself.
      - name: Guard against preview content in production output
        run: |
          for dist in apps/site/dist apps/site/dist-sanity; do
            if grep -rIl -e 'INPUT NEEDED' -e 'data-preview-only' -e 'data-content-mode="preview"' -e 'Preview build' -e 'Specimen' "$dist"; then
              echo "::error::Preview-only content found in $dist (files listed above)."
              exit 1
            fi
            # Indicative mockup graphics (src/assets/figures/indicative) are preview-only.
            if find "$dist" -iname '*indicative*' | grep .; then
              echo "::error::Indicative mockup artwork found in $dist."
              exit 1
            fi
            if find "$dist" -path '*_catalogue*' | grep .; then
              echo "::error::The design-system catalogue must not exist in $dist."
              exit 1
            fi
          done
          # Every build ships its redirects and security headers; the readiness data never ships (Phase 6).
          for dist in apps/site/dist apps/site/dist-preview apps/site/dist-sanity apps/site/dist-sanity-preview; do
            test -s "$dist/_redirects" || { echo "::error::$dist/_redirects missing."; exit 1; }
            test -s "$dist/_headers" || { echo "::error::$dist/_headers missing."; exit 1; }
            if find "$dist" -name '*readiness*' | grep .; then
              echo "::error::Launch-readiness data found in $dist; it must never be deployed."
              exit 1
            fi
          done
          # Publication in Sanity never implies approval: the snapshot's production build must match the fixtures'.
          diff -r apps/site/dist apps/site/dist-sanity

      # End-to-end, responsive and axe (WCAG 2.2 AA) tests against both builds (CLAUDE.md §6, §10).
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      # The preview build must never be indexable.
      - name: Guard against indexable preview output
        run: |
          for dist in apps/site/dist-preview apps/site/dist-sanity-preview; do
            grep -qx 'Disallow: /' "$dist/robots.txt"
            if grep -rIL 'noindex' --include='*.html' "$dist" | grep .; then
              echo "::error::Preview pages without noindex in $dist (listed above)."
              exit 1
            fi
          done
